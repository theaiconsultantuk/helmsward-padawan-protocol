openapi: 3.0.3
info:
  title: Jedi Pack inbox API
  version: 0.1.0
  description: |
    The Jedi Pack support inbox: one ticket in, a decision out (send, hold, escalate or close), with every step traced.
    JSON everywhere except this file. CORS follows `CORS_ORIGIN` (unset or `*` allows any origin; a fixed origin adds `Vary: Origin`; invalid settings omit the allow-origin header; the hosted setting is `https://jedi.blastworks.ai`) and `API_TOKEN` is opt-in: when set, the four POST routes (`/run`, `/ask`, `/feedback`, `/runs/{id}/send`) need `Authorization: Bearer <token>` (see `components.securitySchemes.bearer`); every GET, the pages and `/health` stay open.
    Errors are `{run_id, status: "error", error: {type, message, recoverable}, trace_id, execution_time_seconds}`.
    Start the service with `node src/server.mjs`; `SAMPLE_MODE=true` answers from cached rows with no network.
    The examples below come from a sample-mode run of thread T02.
servers:
  - url: http://127.0.0.1:8000
    description: Default. Set PORT to move it (8810 on the dev VM); HOST defaults to 127.0.0.1.
  - url: https://jedi.blastworks.ai
    description: "Team instance for the hackathon (until 7 Nov 2026 00:00 UTC): pages and API on one origin; POST routes need the bearer token"
paths:
  /health:
    get:
      summary: Liveness and mode
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example: { ok: true, sample_mode: true, version: "0.1.0", uptime_s: 12 }
  /sources:
    get:
      summary: The registered data sources with live row counts
      description: "One entry per Zetaris table. `live` is true when the row count was measured through Zetaris just now, false when the manifest number is shown."
      responses:
        "200":
          description: The sources.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Source" }
              example:
                - { name: employees, format: CSV, table: employees, rows: 200, live: true }
                - { name: decisions, format: CSV, table: decisions, rows: 0, live: true }
                - { name: intake_live, format: REST, table: intake_live, rows: 41, live: false }
  /faq:
    get:
      summary: The FAQ rows
      description: "Every row of the `faq` template (the sample cache in sample mode, Zetaris live), ordered by `faq_id`. The internal `source` column is never returned. Open on a token instance (the token applies to POST only)."
      responses:
        "200":
          description: The FAQ rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FaqRow" }
              example:
                - { faq_id: Q11, question: Do you offer gift wrapping?, answer: "Yes. Gift wrapping is available at checkout.", keywords: gift wrap wrapping present }
  /demo/scenarios:
    get:
      summary: The 14 judge demo scenarios
      description: "The entries of `public/demo-scenarios.json`, s01 to s14, in order. Each carries the message to send, its channel, the `as_of` day and the `expected` outcome the sample-mode loop yields. `name` and `email` are a fallback client; call `GET /demo/client` for a fresh one."
      responses:
        "200":
          description: The scenarios.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DemoScenario" }
              example:
                - id: s09
                  label: Complaint, legal threat
                  scenario: complaint
                  reason: Complaint
                  channel: email
                  name: Havi Hollowell
                  email: havihollowell@email.com
                  message: The Strand Emitter Hilt split open in my hands and I have spoken to my lawyer. If I do not hear from you I will sue.
                  as_of: "2026-10-25"
                  expected: { decision: escalate, branch: complaint-legal, owner_id: 15, team: Support, auto_reply: false, status: open, draft: true, cc: [7, 202] }
                  client: random
  /demo/client:
    get:
      summary: A client for a demo run
      description: "A GENERATED client on every call (fictional given and family name from two fixed lists, `<given><family>.<suffix>@email.com` lower-case, with a random six-character base-36 suffix), so a repeated demo never meets a prior refund. For `scenario=s04` the seeded customer from `customers.csv` whose earlier refunds (T02, T06) are on record. For `scenario=s10` the owner of order JP-1001 (Cass Holm, cass.holm@example.com): `{ customer_id, name, email, generated: false, order_owner: true, order_id }`. Sent with `Cache-Control: no-store`. An unknown scenario id answers 400."
      parameters:
        - { name: scenario, in: query, required: false, schema: { type: string, pattern: "^s(0[1-9]|1[0-4])$" }, example: s04 }
      responses:
        "200":
          description: The client.
          headers:
            Cache-Control: { schema: { type: string }, description: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoClient" }
              example: { name: Emeric Kettleby, email: emerickettleby.a1b2c3@email.com, generated: true }
        "400": { $ref: "#/components/responses/BadRequest" }
  /intake:
    get:
      summary: Contact-form submissions (the REST source Zetaris reads)
      description: "The same 41 synthetic submissions as `contact_form_submissions`, served as a JSON array. Zetaris registers it as `JEDI_PACK.intake_live`."
      responses:
        "200":
          description: The submissions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Intake" }
              example:
                - submission_id: CF-T03
                  thread_id: T03
                  received_at: "2026-10-22T09:28:00Z"
                  name: Cass Holm
                  email: cass.holm@example.com
                  subject: Refund over the limit
                  message: I want a refund of 400.00 GC for order JP-1104. The case never arrived.
                  fictional: true
  /run:
    post:
      security: [{}, {bearer: []}]
      summary: Run the loop on one ticket
      description: Returns the decision with its cited rows and a `trace_id`. A successful run also writes a row into the decisions table, so it can be given feedback.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
            examples:
              thread: { summary: A stored thread, value: { run_id: demo-1, input: { thread_id: T02 } } }
              message: { summary: A free-text message, value: { run_id: demo-msg, input: { message: "How long does shipping take?", from: a@example.com, channel: chat, as_of: "2026-10-20" } } }
      responses:
        "200":
          description: The run result (also kept for `GET /runs/{id}`). A message run gets a ticket id `F<n>` in `input.thread_id`, is recorded in the decisions table under that id and takes `/feedback` like any other run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResult" }
              examples:
                message:
                  summary: Sample-mode run of a free-text FAQ question (trimmed from a real run)
                  value:
                    run_id: demo-msg
                    status: success
                    output:
                      decision: send
                      reasons: ["FAQ Q01 answers it; FAQ Q01 matches (score 1.00, shared: long, shipping, take); FAQ text is canonical, the floor gates model drafts"]
                      cited_rows: ["intake_runtime:F1 (local)", "responsibility:question", "employees:1", "employees:2", "trust_ledger:question", "faq:Q01"]
                      draft:
                        text: "Hello,\n\nShipping time depends on your region and the product. Your order confirmation shows the estimate for your address, and customer service can tell you where your order is.\n\nBest regards,\nJedi Pack Support"
                        promises: { refund_amount: null, replacement: false, other: null }
                        model: faq/canonical
                    trace_id: demo-msg
                    log_file: logs/trace-demo-msg.jsonl
                    execution_time_seconds: 0.015
                    scenario: question
                    resolved_how: scout
                    branch_id: faq-hit
                    input: { kind: message, thread_id: F1, text: "How long does shipping take?", from: a@example.com, name: null, channel: chat, received_at: "2026-10-23T05:13:50.034Z", as_of: "2026-10-20" }
                thread:
                  value:
                    run_id: demo-1
                    status: success
                    output:
                      decision: hold
                      reasons: ["refund weight 0.55 is under the floor 0.8; owner 15 out, backup 27 in. Both critics passed; the reply waits for backup 27 with the draft attached"]
                      cited_rows: ["threads_parquet:T02", "policy:refund", "employees:15", "trust_ledger:refund"]
                      draft:
                        text: "Hello Lira Venn,\n\nYou wrote about \"Refund for order JP-1042\". We will refund 40.0 GC.\n\nBest regards,\nJedi Pack Support"
                        promises: { refund_amount: "40.0", replacement: false, other: null }
                        model: sample/rules
                    agents: [{ name: Planner, role: plan and delegate }, { name: Executor, role: facts from Zetaris }]
                    trace_id: demo-1
                    log_file: logs/trace-demo-1.jsonl
                    execution_time_seconds: 0.011
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503":
          description: "At most 2 live runs across /run and /ask; Busy is recoverable. Message runs also return IntakeFull (not recoverable) at 5000 intake rows."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                busy:
                  value: { run_id: null, status: error, error: { type: Busy, message: "busy: 2 live runs in flight (cap 2); retry later", recoverable: true }, trace_id: null, execution_time_seconds: 0 }
                intakeFull:
                  value: { run_id: null, status: error, error: { type: IntakeFull, message: "intake full: 5000 rows (cap); message runs refused", recoverable: false }, trace_id: null, execution_time_seconds: 0 }

  /ask:
    post:
      security: [{}, {bearer: []}]
      summary: Ask a question about policy, owners or a customer
      description: Scout guards the question first (a blocked one is refused with no model call), then Zetaris rows are read and the answer is phrased only from them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
            example: { question: "Can I get a refund on my lightsaber?" }
      responses:
        "200":
          description: The answer with the rows it used. `run_id` also works on `GET /runs/{id}/trace`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskResult" }
              example:
                run_id: ask_mvk7ru456hv
                answer: "The refund limit is 150 GC: up to it the owner is employee 15 (backup 27), above it the Sales head, employee 40 (the CEO, employee 201, when out). Source: the \"Refund policy\" page."
                intent: refund.request
                cited_rows: [policy:refund, categories:refund, trust_ledger:refund, wiki_refund_policy]
                model: sample/rules
                confidence: 0.294
                trace_id: ask_mvk7ru456hv
                log_file: logs/trace-ask_mvk7ru456hv.jsonl
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503":
          description: "At most 2 live runs across /run and /ask; Busy is recoverable."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                busy:
                  value: { run_id: null, status: error, error: { type: Busy, message: "busy: 2 live runs in flight (cap 2); retry later", recoverable: true }, trace_id: null, execution_time_seconds: 0 }

  /runs:
    get:
      summary: The stored runs and asks, newest first
      description: Reads the in-memory store (the last 200, so a restart forgets them). `kind` is `ask` for `POST /ask` results and `run` otherwise. `at` is the time the run finished.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 }, example: 20 }
      responses:
        "200":
          description: The runs, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunListItem" }
              example:
                - { run_id: ex-rfq, kind: run, scenario: rfq, decision: escalate, thread_id: F2, branch_id: rfq, execution_time_seconds: 0.013, at: "2026-10-23T05:17:41.691Z" }
                - { run_id: ex-faq, kind: run, scenario: question, decision: send, thread_id: F1, branch_id: faq-hit, execution_time_seconds: 0.015, at: "2026-10-23T05:17:41.671Z" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /runs/{id}/journey:
    get:
      summary: The run as a journey a person can read
      description: Derived from the stored result and the run's trace file, so it is 404 when either is gone. One node per trace line, with what each step consulted and what the reply kept.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: ex-rfq }
      responses:
        "200":
          description: The journey.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journey" }
              example:
                run_id: ex-rfq
                scenario: rfq
                resolved_how: declared
                decision: escalate
                input: { kind: message, thread_id: F2, text: Incoming RFQ for price difference between ordering 100000 training sabers and 100, from: buyer@example.com, name: null, channel: chat, received_at: "2026-10-23T05:17:41.678Z", as_of: "2026-10-20" }
                nodes:
                  - { n: 1, step: memory.read, agent: Memory, label: Memory read, route: empty (cold first run), consulted: [], retained: [], reached_human: false, status: success, model: null, timestamp: "2026-10-23T05:17:41Z" }
                human:
                  input: Incoming RFQ for price difference between ordering 100000 training sabers and 100
                  path: [Memory read, Plan, "Branch: rfq", Hand-off, Reply]
                  reply:
                    kind: escalation
                    text: "Hello,\n\nThank you, your request for a quote is with our sales team."
                    to: { employee_id: 6, name: Tomas Keller, role: rfq owner }
                    attachments: ["products:FS-B01"]
                    blanks: []
                    recommendation: The records hold one unit price; sales to quote.
                reached_human:
                  who: { employee_id: 6, name: Tomas Keller }
                  what: [the draft, both critiques, "products:FS-B01"]
                  queue_file: queue/F2.json
        "404": { $ref: "#/components/responses/NotFound" }
  /queue:
    get:
      summary: What is waiting for a human
      description: Every file under `data/memory/queue/` (read on each call, `[]` when the folder is absent) plus the runs that ended on `hold` with a draft. Newest first. A queue file row names `approver` when the ticket needed an approval, otherwise `owner`.
      responses:
        "200":
          description: The waiting items.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QueueItem" }
              example:
                - ticket_id: F2
                  file: F2.json
                  category: rfq
                  decision_reason: "rfq: one unit price (189 GC), no volume tiers. Sales to quote."
                  owner: { employee_id: 6, name: Tomas Keller }
                  has_draft: true
                  critiques: []
                  mtime: "2026-10-23T05:17:41.690Z"
  /runs/{id}:
    get:
      summary: A stored run or ask result
      description: Results are kept in memory (the last 200), so a restart forgets them.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: demo-1 }
      responses:
        "200":
          description: The result exactly as `POST /run` (or `/ask`) returned it.
          content:
            application/json:
              schema: { type: object }
              example: { run_id: demo-1, status: success, output: { decision: hold, cited_rows: ["threads_parquet:T02"] }, trace_id: demo-1, log_file: logs/trace-demo-1.jsonl }
        "404": { $ref: "#/components/responses/NotFound" }
  /runs/{id}/trace:
    get:
      summary: The run's trace as a JSON array, one object per step
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: demo-1 }
      responses:
        "200":
          description: The trace lines in order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TraceLine" }
              example:
                - { timestamp: "2026-10-23T00:10:42Z", run_id: demo-1, trace_id: demo-1, step: memory.read, agent_name: Memory, action: memory_read, input_summary: Lira Venn refund T02, output_summary: "4 memories: mem-7 (...)", status: success }
        "404": { $ref: "#/components/responses/NotFound" }
  /feedback:
    post:
      security: [{}, {bearer: []}]
      summary: Affirm or reject a decision
      description: Sets the decision row's verdict and delta (affirm +0.05, reject -0.05), then refreshes the Zetaris decisions table so `/counters` and the trust floor see it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackRequest" }
            example: { run_id: demo-1, verdict: affirm, note: good call }
      responses:
        "200":
          description: The updated decision row. `published` says whether the table reached Zetaris (false in sample mode).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
              example: { run_id: demo-1, thread_id: T02, category: refund, decision: hold, verdict: affirm, delta: 0.05, ts: "2026-10-23T00:10:42.128Z", note: good call, published: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /runs/{id}/send:
    post:
      security: [{}, {bearer: []}]
      summary: Send the reply on a held or escalated run
      description: "Records that the reply went out. Only a run that ended on `hold` or `escalate` can be sent. Body `text` (1 to 4000 characters) is the reply as sent; absent, the run's own draft is used, and a run with no draft and no `text` is a 400, as is a run with no ticket id. Status rule: `hold` gives `handled`; `escalate` with `queued_for.approval` gives `handled`; `escalate` without an approval gives `follow_up`. It writes the ticket's queue file under `data/memory/queue/` and the run's `GET /runs/{id}/journey` then carries `sent` and the overriding `status`. A second send on the same run is a 409."
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendRequest" }
            example: { by: Tomas Keller, text: "Hello, thank you for your patience ..." }
      responses:
        "200":
          description: The send was recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendResult" }
              example: { run_id: demo-1, ticket_id: F2, status: follow_up, sent: { run_id: demo-1, by: Tomas Keller, at: "2026-10-24T09:00:00.000Z", body: "Hello, thank you for your patience ...", status: follow_up, ticket_id: F2 }, queue_file: data/memory/queue/F2.json }
        "400":
          description: The run is not a hold or an escalation, has no draft and no `text`, has no ticket id, or `text` is too long.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: The instance runs with API_TOKEN set and the bearer token is missing or wrong.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405":
          description: The route takes POST only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: This run was already sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /counters:
    get:
      summary: Decision and feedback counters
      description: Read through Zetaris from `JEDI_PACK.decisions` (from the local file in sample mode). `queued` is the escalate count.
      responses:
        "200":
          description: The counters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Counters" }
              example: { send: 0, hold: 1, escalate: 0, close: 0, queued: 0, affirmed: 1, rejected: 0 }
  /openapi.yaml:
    get:
      summary: This file
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
              example: "openapi: 3.0.3"
  /:
    get:
      summary: The front page
      description: "Serves `public/index.html`, a redirect page to the storefront; the reference form is at /inbox. 404 with the structured error until the page exists. The page only uses the API."
      responses:
        "200":
          description: The redirect page.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /inbox:
    get:
      summary: The reference form
      description: "Serves `public/inbox.html`, the reference inbox form (picker, name, email, message, demo buttons, the two views). 404 with the structured error until the page exists. The page only uses the API."
      responses:
        "200":
          description: The reference form.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /shop:
    get:
      summary: The storefront entry
      description: "302 redirect to `/shop/index.html`."
      responses:
        "302":
          description: Redirect to /shop/index.html.
          headers:
            Location: { schema: { type: string, example: /shop/index.html } }
  /shop/{path}:
    get:
      summary: A storefront file
      description: "Serves `public/shop/<path>` (index.html, shop.html, product.html, faq.html, contact.html, and their scripts, styles, images and models). Closed extension list: `.html .css .js .json .svg .webp .png .jpg .woff2 .glb .mp4 .ico`. Any other extension, a missing file or any traversal is a 404."
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The file; `Content-Type` follows the extension.
          content:
            text/html:
              schema: { type: string }
            text/css:
              schema: { type: string }
            application/javascript:
              schema: { type: string }
            application/json:
              schema: { type: object }
            image/*:
              schema: { type: string, format: binary }
            font/woff2:
              schema: { type: string, format: binary }
            model/gltf-binary:
              schema: { type: string, format: binary }
            video/mp4:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
  /dashboard:
    get:
      summary: The internal dashboard
      description: "Counters, the queue, recent runs and affirm/reject buttons. Served with `Cache-Control: no-store`."
      responses:
        "200":
          description: The dashboard page.
          content:
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /static/{name}:
    get:
      summary: A page asset from a closed list
      description: "Reference server: serves `public/<name>` for exactly these names; anything else, including path tricks, is a 404. Hosted instance (https://jedi.blastworks.ai): the pages are served by a static file server, so ANY file under `inbox/public/` on main is reachable as `/static/<name>`, hidden paths (a segment starting with `.`) are 404, and a traversal never leaves the release. The four names here are the ones both servers agree on. `Content-Type` follows the extension (`.js` application/javascript, `.css` text/css, `.json` application/json, all UTF-8)."
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, enum: [app.js, dashboard.js, style.css, demo-scenarios.json] }
      responses:
        "200":
          description: The file.
          content:
            application/javascript:
              schema: { type: string }
            text/css:
              schema: { type: string }
            application/json:
              schema: { type: object }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Only when the instance runs with API_TOKEN set (a shared instance); the default loopback instance needs no token. Applies to POST /run, /ask, /feedback and /runs/{id}/send; reads and pages stay open.
  responses:
    UnsupportedMediaType:
      description: Every POST body requires application/json, with optional parameters such as charset=utf-8.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { run_id: null, status: error, error: { type: UnsupportedMediaType, message: "unsupported media type: application/json required", recoverable: false }, trace_id: null, execution_time_seconds: 0 }
    BadRequest:
      description: The body or a field is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { run_id: null, status: error, error: { type: BadRequest, message: verdict must be affirm or reject, recoverable: false }, trace_id: null, execution_time_seconds: 0.001 }
    NotFound:
      description: Unknown thread, run or decision.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { run_id: nope, status: error, error: { type: NotFound, message: no stored run nope, recoverable: false }, trace_id: null, execution_time_seconds: 0 }
    Conflict:
      description: The `run_id` was already used by a stored run (thread or message).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { run_id: demo-1, status: error, error: { type: Conflict, message: run_id demo-1 was already used, recoverable: false }, trace_id: null, execution_time_seconds: 0 }
  schemas:
    Health:
      type: object
      properties: { ok: { type: boolean }, sample_mode: { type: boolean }, version: { type: string }, uptime_s: { type: integer } }
    Source:
      type: object
      properties: { name: { type: string }, format: { type: string }, table: { type: string }, rows: { type: integer }, live: { type: boolean } }
    Intake:
      type: object
      properties: { submission_id: { type: string }, thread_id: { type: string }, received_at: { type: string }, name: { type: string }, email: { type: string }, subject: { type: string }, message: { type: string }, fictional: { type: boolean } }
    RunRequest:
      type: object
      required: [input]
      properties:
        run_id: { type: string, pattern: "^[A-Za-z0-9._-]{1,80}$", description: "Optional, generated when absent. A run_id already used answers 409." }
        input:
          oneOf:
            - $ref: "#/components/schemas/ThreadInput"
            - $ref: "#/components/schemas/MessageInput"
          description: "A stored thread (`thread_id`) or a free-text message (`message`, `from`, `channel`); a body with neither is a 400."
        options: { type: object, properties: { sample_mode: { type: boolean } } }
    ThreadInput:
      type: object
      required: [thread_id]
      properties: { thread_id: { type: string, example: T02, description: "An id from the thread index; unknown ids answer 404." }, as_of: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$", example: "2026-10-22" } }
    MessageInput:
      type: object
      required: [message, from, channel]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000, description: Trimmed before the length check. }
        from: { type: string, minLength: 1, maxLength: 200, description: An email address or a name. }
        channel: { type: string, enum: [email, contact-form, chat, trustpilot] }
        scenario: { type: string, enum: [refund, question, rfq, complaint, free_text], description: "Declares the scenario. Absent means free_text: the loop resolves it from the message (see `resolved_how`)." }
        name:
          type: string
          maxLength: 200
          pattern: "^[\\p{L}\\p{M}' ’-]+$"
          description: "Letters (including Unicode letters and combining marks), spaces, hyphens and apostrophes only; a non-empty name must contain a letter. Invalid names return 400 with: name: only letters, space, - and ' allowed."
        subject: { type: string, maxLength: 200, description: Defaults to the first 60 characters of the message. }
        as_of: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$", example: "2026-10-20", description: "Date the facts are read as of (holidays, availability); today when absent." }
    ResolvedScenario:
      type: string
      enum: [refund, question, rfq, complaint, free_text, legacy, customer_service]
      description: "The scenario the loop resolved. Wider than the request's declared scenario: a thread ticket resolves to legacy, an unrouted free text to customer_service."
    RunResult:
      type: object
      properties:
        run_id: { type: string }
        status: { type: string, enum: [success, error] }
        output:
          type: object
          properties:
            decision: { type: string, enum: [send, hold, escalate, close] }
            reasons: { type: array, items: { type: string } }
            cited_rows: { type: array, items: { type: string } }
            draft: { type: object }
            recommendation: { type: string, description: Present when the run recommends an action to the person it queues for. }
            team: { type: string, description: "The team that owns the ticket, or the team an auto reply is sent on behalf of: Support, Sales, Product, Legal, Billing, Fulfilment, Finance, People, Engineering." }
            team_label: { type: string, description: "The team's display name (fiction, labels only), for example Helpful Hands Hangar." }
            backup_team: { type: string, nullable: true, description: "The backup's team, read only when the owner is out or the route names one." }
            topic_label: { type: string, description: "The topic's display name, for example Department of Giving It Back." }
            channel_label: { type: string, description: "The channel's display name, for example Direct email or Contact form." }
            cc: { type: array, description: "People in copy (department heads on a legal route).", items: { $ref: "#/components/schemas/Participant" } }
            also: { type: array, description: "Other people the ticket is also routed to (Legal counsel on a legal route).", items: { $ref: "#/components/schemas/Participant" } }
            status: { type: string, enum: [open, handled, follow_up], description: "open at routing; handled at once for an auto reply. POST /runs/{id}/send (Plan 2) sets handled, or follow_up when courtesy_reply is true." }
            auto_reply: { type: boolean, description: "true only for a sent draft (decision send); a hold or escalate is never an auto reply." }
            memory_note: { type: string, nullable: true, description: "H-MEM's note, for example Second Refund Request from this client (2 earlier: T02, T06)." }
            trusted_to_send: { type: boolean, description: "The trust-floor yes or no: true when the reply cleared the trust floor. A reply composed from rows can send while this is false." }
            courtesy_reply: { type: boolean, description: "true only on the legal route: the draft is a courtesy reply, so the send marks follow_up." }
            queued_for:
              type: object
              properties:
                owner_id: { type: integer }
                owner_name: { type: string }
                backup_id: { type: integer }
                backup_name: { type: string, nullable: true, description: "Read only when the owner is out; null otherwise." }
                role: { type: string, description: "The owner's role, or default contact when the contact desk is the target." }
                team: { type: string }
                team_label: { type: string }
                backup_team: { type: string, nullable: true }
                topic_label: { type: string }
                cc: { type: array, items: { $ref: "#/components/schemas/Participant" } }
                also: { type: array, items: { $ref: "#/components/schemas/Participant" } }
                status: { type: string, enum: [open, handled, follow_up] }
                auto_reply: { type: boolean }
                memory_note: { type: string, nullable: true }
                channel_label: { type: string }
                courtesy_reply: { type: boolean }
                fallback_contact:
                  type: object
                  nullable: true
                  description: "Set when owner and backup are both out: the contact desk the ticket is routed to, read from JEDI_PACK.contacts."
                  properties:
                    email: { type: string }
                    label: { type: string }
                    cited: { type: string, description: "The row id, contacts:default." }
                attachments:
                  type: object
                  description: The rows the owner needs, attached to a queued item.
                  properties:
                    prices: { type: array, items: { type: object } }
                    quantities: { type: array, items: { type: object } }
                    products: { type: array, items: { type: object } }
                    quote:
                      type: object
                      description: "A quote (rfq routes): tier AND parts. A part out of stock is flagged short and holds the quote for Sales."
                      properties:
                        sku: { type: string, example: FS-B01 }
                        quantity: { type: integer }
                        tier: { type: string, example: squad }
                        unit_price: { type: number }
                        discount_pct: { type: number }
                        total: { type: number }
                        currency: { type: string, example: GC }
                        parts:
                          type: array
                          items:
                            type: object
                            properties:
                              part_id: { type: string, example: PT-0001 }
                              part_name: { type: string }
                              needed: { type: integer }
                              stock: { type: integer }
                              short: { type: boolean }
                    cited: { type: array, items: { type: string }, description: "Row ids, for example products:FS-B01." }
        scenario: { $ref: "#/components/schemas/ResolvedScenario" }
        resolved_how: { type: string, enum: [declared, thread, scout, gates, faq, none, unrouted], description: How the scenario was decided. }
        branch_id: { type: string, nullable: true, description: "The branch the loop took, for example faq-hit. Free text: the legacy ids (send-ok, thank-you, follow-up, duplicate, public-channel, owner-out, over-limit, under-floor, data-block, misread, unknown) and the scenario ids, including delivery-not-owner." }
        input:
          type: object
          description: The ticket as the loop read it.
          properties:
            kind: { type: string, enum: [thread, message] }
            thread_id: { type: string, description: "T<n> for a thread, F<n> for a message." }
            text: { type: string }
            from: { type: string }
            name: { type: string, nullable: true }
            channel: { type: string }
            received_at: { type: string }
            as_of: { type: string, nullable: true }
        agents: { type: array, items: { type: object } }
        trace_id: { type: string }
        log_file: { type: string }
        execution_time_seconds: { type: number }
    AskRequest:
      type: object
      required: [question]
      properties: { question: { type: string, maxLength: 2000 }, customer: { type: string, description: "Optional customer email or name; adds that customer's open ticket to the rows." } }
    AskResult:
      type: object
      properties:
        run_id: { type: string }
        answer: { type: string }
        intent: { type: string }
        cited_rows: { type: array, items: { type: string } }
        model: { type: string, nullable: true }
        confidence: { type: number }
        trace_id: { type: string }
        log_file: { type: string }
        refused: { type: object, description: Present only when Scout blocked the question. }
    FeedbackRequest:
      type: object
      required: [run_id, verdict]
      properties: { run_id: { type: string }, verdict: { type: string, enum: [affirm, reject] }, note: { type: string } }
    Decision:
      type: object
      properties:
        run_id: { type: string }
        thread_id: { type: string }
        category: { type: string }
        decision: { type: string }
        verdict: { type: string, enum: [affirm, reject, ""] }
        delta: { type: number }
        ts: { type: string }
        note: { type: string }
        published: { type: boolean }
    Counters:
      type: object
      properties: { send: { type: integer }, hold: { type: integer }, escalate: { type: integer }, close: { type: integer }, queued: { type: integer }, affirmed: { type: integer }, rejected: { type: integer } }
    RunListItem:
      type: object
      required: [run_id, kind, at]
      properties:
        run_id: { type: string }
        kind: { type: string, enum: [run, ask] }
        scenario: { type: string, nullable: true }
        decision: { type: string, nullable: true, enum: [send, hold, escalate, close, null] }
        thread_id: { type: string, nullable: true }
        branch_id: { type: string, nullable: true }
        execution_time_seconds: { type: number, nullable: true }
        at: { type: string, format: date-time, nullable: true }
    Person:
      type: object
      properties:
        employee_id: { type: integer, nullable: true }
        name: { type: string, nullable: true }
    QueueItem:
      type: object
      description: A queue file row has `file`, `category`, `decision_reason`, `critiques`, `mtime` and `approver` or `owner`. A held row has `kind` held, `run_id`, `recommendation` and `at`.
      required: [ticket_id, has_draft]
      properties:
        ticket_id: { type: string, nullable: true }
        file: { type: string }
        category: { type: string, nullable: true }
        decision_reason: { type: string, nullable: true }
        approver: { $ref: "#/components/schemas/Person" }
        owner: { $ref: "#/components/schemas/Person" }
        has_draft: { type: boolean }
        critiques: { type: array, items: {} }
        mtime: { type: string, format: date-time }
        run_id: { type: string }
        kind: { type: string, enum: [held] }
        scenario: { type: string, nullable: true }
        recommendation: { type: string, nullable: true }
        at: { type: string, format: date-time, nullable: true }
        status: { type: string, nullable: true, enum: [handled, follow_up, null], description: "Set once a reply was sent on this ticket (POST /runs/{id}/send)." }
        sent_at: { type: string, nullable: true, description: When the reply was sent. }
    JourneyNode:
      type: object
      properties:
        n: { type: integer }
        step: { type: string, nullable: true }
        agent: { type: string, nullable: true }
        label: { type: string }
        route: { type: string, nullable: true }
        detail: { type: string, nullable: true, description: "The rows in words when a Zetaris query read a record a person would want to see (an employee's name, role and team; a policy's limit and owners; a topic's owner and backup), else null." }
        consulted: { type: array, items: { type: string } }
        retained: { type: array, description: Always a subset of consulted., items: { type: string } }
        reached_human: { type: boolean }
        status: { type: string, nullable: true }
        model: { type: string, nullable: true }
        timestamp: { type: string, nullable: true, description: "ISO with milliseconds (.mmmZ)." }
        duration_ms: { type: integer, description: "Milliseconds since the previous line of the same run, 0 for the first." }
        tech: { type: string, description: "What did the step: Zetaris, Meterless (Scout contract), Meterless (World Model), Nightshift (<model>), OpenJev (<model>), H-MEM, rules or not run; read from the line's own fields, never guessed (unknown only when the line records none)." }
        returned: { description: "What the step handed back. Zetaris: the HIT rows only ([{id, table, key, detail}]), [] when nothing matched; a model: its reply text as traced; other techs: null." }
    Participant:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        email: { type: string, nullable: true }
    FaqRow:
      type: object
      required: [faq_id, question, answer, keywords]
      properties:
        faq_id: { type: string, example: Q11 }
        question: { type: string }
        answer: { type: string }
        keywords: { type: string }
    DemoExpected:
      type: object
      required: [decision, branch, owner_id, team, auto_reply, status, draft]
      properties:
        decision: { type: string, enum: [send, hold, escalate, close] }
        branch: { type: string }
        owner_id: { type: integer, nullable: true, description: "The employee the run waits on; null for an auto reply (nobody owns a ticket answered at once)." }
        team: { type: string }
        auto_reply: { type: boolean }
        status: { type: string, enum: [open, handled, follow_up] }
        draft: { type: boolean }
        memory_note: { type: boolean, description: Present and true only when H-MEM's note is expected. }
        cc: { type: array, items: { type: integer }, description: Employee ids in copy. }
    DemoScenario:
      type: object
      required: [id, label, scenario, reason, channel, name, email, message, as_of, expected, client]
      properties:
        id: { type: string, pattern: "^s(0[1-9]|1[0-4])$" }
        label: { type: string }
        scenario: { type: string, enum: [refund, question, rfq, complaint, free_text], description: "The declared scenario to POST (MessageInput.scenario)." }
        reason: { type: string, enum: [Refund, Question, Quote, Complaint, Other, Review, Email] }
        channel: { type: string, enum: [email, contact-form, chat, trustpilot] }
        name: { type: string }
        email: { type: string }
        message: { type: string }
        as_of: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        expected: { $ref: "#/components/schemas/DemoExpected" }
        client: { type: string, enum: [random, seeded-second-refund, seeded-order-owner] }
    DemoClient:
      type: object
      required: [name, email, generated]
      properties:
        customer_id: { type: string, description: "Only on the seeded client." }
        name: { type: string }
        email: { type: string }
        generated: { type: boolean }
        seeded_prior_refund: { type: boolean, description: "Only on the seeded client: true." }
        order_owner: { type: boolean, description: "Only on the s10 client: true, the owner of order_id." }
        order_id: { type: string, description: "Only on the s10 client, for example JP-1001." }
    Journey:
      type: object
      required: [run_id, nodes, human, reached_human]
      properties:
        run_id: { type: string, nullable: true }
        scenario: { type: string, nullable: true }
        resolved_how: { type: string, nullable: true, enum: [declared, thread, scout, gates, faq, none, unrouted, null] }
        decision: { type: string, nullable: true, enum: [send, hold, escalate, close, null] }
        team: { type: string, nullable: true }
        team_label: { type: string, nullable: true }
        topic_label: { type: string, nullable: true }
        cc: { type: array, items: { $ref: "#/components/schemas/Participant" } }
        also: { type: array, items: { $ref: "#/components/schemas/Participant" } }
        status: { type: string, nullable: true, enum: [open, handled, follow_up, null], description: "The lifecycle status. A send (POST /runs/{id}/send) overrides it with `handled` or `follow_up`." }
        ticket_status: { type: string, nullable: true, description: "The ticket's own status before any send override." }
        sent:
          type: object
          nullable: true
          description: The reply that was sent on this run; null until a send.
          properties:
            by: { type: string, nullable: true }
            at: { type: string }
            body: { type: string }
            status: { type: string, enum: [handled, follow_up] }
            ticket_id: { type: string }
            queue_file: { type: string, nullable: true }
        auto_reply: { type: boolean }
        memory_note: { type: string, nullable: true }
        channel_label: { type: string, nullable: true }
        trusted_to_send: { type: boolean }
        courtesy_reply: { type: boolean, description: "Present and true only on the legal route." }
        input:
          type: object
          properties:
            kind: { type: string, nullable: true, enum: [message, thread, ask, null] }
            thread_id: { type: string, nullable: true }
            text: { type: string, nullable: true }
            from: { type: string, nullable: true }
            name: { type: string, nullable: true }
            channel: { type: string, nullable: true }
            received_at: { type: string, nullable: true }
            as_of: { type: string, nullable: true }
        nodes: { type: array, description: One per trace line., items: { $ref: "#/components/schemas/JourneyNode" } }
        human:
          type: object
          properties:
            input: { type: string, nullable: true }
            path: { type: array, items: { type: string } }
            reply:
              type: object
              properties:
                kind: { type: string, enum: [auto_reply, draft_for_human, escalation, answer, none] }
                text: { type: string, nullable: true }
                to: { type: object, nullable: true, description: "The person or desk the reply waits for: employee_id and name, or email when the default contact desk is the recipient." }
                attachments: { type: array, items: { type: string } }
                blanks: { type: array, items: { type: string } }
                recommendation: { type: string, nullable: true }
        reached_human:
          type: object
          nullable: true
          properties:
            who: { $ref: "#/components/schemas/Person" }
            what: { type: array, items: { type: string } }
            queue_file: { type: string, nullable: true, description: "queue/<thread_id>.json inside the memory dir; null when the queue write failed; absent on a plain hold" }
    SendRequest:
      type: object
      properties:
        by: { type: string, maxLength: 120, description: Who is sending. }
        text: { type: string, minLength: 1, maxLength: 4000, description: "The reply as sent; absent means the run's own draft." }
    SendResult:
      type: object
      required: [run_id, ticket_id, status, sent, queue_file]
      properties:
        run_id: { type: string }
        ticket_id: { type: string }
        status: { type: string, enum: [handled, follow_up] }
        sent:
          type: object
          properties:
            run_id: { type: string }
            by: { type: string, nullable: true }
            at: { type: string }
            body: { type: string }
            status: { type: string, enum: [handled, follow_up] }
            ticket_id: { type: string }
        queue_file: { type: string }
    TraceLine:
      type: object
      properties: { timestamp: { type: string, description: ISO with milliseconds }, duration_ms: { type: integer, description: since the previous line of the run }, elapsed_ms: { type: integer, description: since the run's first line }, run_id: { type: string }, trace_id: { type: string }, step: { type: string }, agent_name: { type: string }, action: { type: string }, input_summary: { type: string }, output_summary: { type: string }, status: { type: string } }
      additionalProperties: true
    Error:
      type: object
      properties:
        run_id: { type: string, nullable: true }
        status: { type: string, example: error }
        error: { type: object, properties: { type: { type: string }, message: { type: string }, recoverable: { type: boolean } } }
        trace_id: { type: string, nullable: true }
        execution_time_seconds: { type: number }
