<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="api-base" content="">
<title>Jedi Pack inbox</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site">
  <h1>Jedi Pack inbox</h1>
  <nav><a href="/dashboard">Dashboard</a></nav>
</header>
<main>
  <form id="form" class="card intake" autocomplete="off">
    <fieldset class="reasons">
      <legend>Why are you contacting us?</legend>
      <div class="pills">
        <label class="pill"><input type="radio" name="scenario" value="refund"><span>Refund</span></label>
        <label class="pill"><input type="radio" name="scenario" value="question"><span>A question</span></label>
        <label class="pill"><input type="radio" name="scenario" value="rfq"><span>Request for quote</span></label>
        <label class="pill"><input type="radio" name="scenario" value="complaint"><span>A complaint</span></label>
        <label class="pill"><input type="radio" name="scenario" value="free_text" checked><span>Something else</span></label>
      </div>
    </fieldset>
    <div class="fields">
      <label class="field">Name<input type="text" id="name" name="name" maxlength="120"></label>
      <label class="field">Email<input type="email" id="email" name="email" maxlength="200"></label>
    </div>
    <label class="field">Message<textarea id="message" name="message" rows="5" maxlength="4000" required></textarea></label>
    <input type="hidden" id="as_of" name="as_of" value="">
    <div class="demos">
      <h2>Demo scenarios</h2>
      <div id="demos" class="demo-list"></div>
    </div>
    <div class="submit-row">
      <button type="submit" id="submit">Submit</button>
      <p id="status" class="muted" role="status" aria-live="polite"></p>
    </div>
  </form>
  <div id="split" class="split" hidden>
    <section class="card side" aria-labelledby="h-human">
      <h2 id="h-human">How a person sees it</h2>
      <div id="human"></div>
    </section>
    <section class="card side" aria-labelledby="h-hood">
      <h2 id="h-hood">Under the hood</h2>
      <div id="hood"></div>
    </section>
  </div>
</main>
<script src="/static/app.js"></script>
</body>
</html>
